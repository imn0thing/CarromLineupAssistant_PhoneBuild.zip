name: Build Carrom APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip CarromLineupAssistant_PhoneBuild.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/CarromLineupAssistant
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Carrom-Lineup-APK
          path: extracted/CarromLineupAssistant/app/build/outputs/apk/debug/app-debug.apk
